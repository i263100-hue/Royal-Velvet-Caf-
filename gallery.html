<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Royal Velvet Café - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header-container">
        <div class="logo-box">
            <img src="images/image.png" alt="Cafe Logo" class="cafe-pic">
        </div>
        <h1 class="cafe-name">Royal Velvet Café</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <a href="index.html">Home</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <hr class="divider">

    <!-- Gallery Section -->
    <main class="menu-container">
        <h2 class="menu-heading">Food & Coffee Gallery</h2>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/logo.png" alt="Espresso Coffee">

            </div>
            <div class="gallery-item">
                <img src="images/logo.png" alt="Club Sandwich">
                <p>Club Sandwich</p>
            </div>
            <div class="gallery-item">
                <img src="images/logo.png" alt="Chocolate Brownie">
                <p>Chocolate Brownie</p>
            </div>
            <div class="gallery-item">
                <img src="images/logo.png" alt="Cold Brew">
                <p>Cold Brew</p>
            </div>
            <div class="gallery-item">
                <img src="images/logo.png" alt="Velvet Cake">
                <p>Velvet Cake</p>
            </div>
            <div class="gallery-item">
                <img src="images/logo.png" alt="Special Tea">
