<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Velvet Café - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header-container">
        <div class="logo-box">
            <img src="images/image.png" alt="Cafe Logo" class="cafe-pic">
        </div>
        <h1 class="cafe-name">Royal Velvet Café</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact Us</a>
    </nav>

    <hr class="divider">

    <!-- Contact Section -->
    <main class="menu-container">
        <h2 class="menu-heading">Contact Us</h2>
        
        <form class="contact-form" onsubmit="event.preventDefault(); submitForm();">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="4" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="order-btn">Send Message</button>
        </form>
    </main>

    <!-- JavaScript Interactivity -->
    <script>
        function submitForm() {
            var name = document.getElementById('name').value;
            console.log("Contact form submitted by: " + name);
            window.alert("Thank you " + name + "! Your message has been sent successfully.");
        }
    </script>

</body>
</html>
